<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Entre em contato comigo através do formulário.">

    <title>Contato | Meu Portfólio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                Portfólio
            </a>

            <button
                class="menu-button"
                aria-label="Abrir menu"
            >
                ☰
            </button>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="quem-sou.html">
                        Quem sou
                    </a>
                </li>

                <li>
                    <a href="projetos.html">
                        Projetos
                    </a>
                </li>

                <li>
                    <a href="contato.html">
                        Contato
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section>

            <div class="container">

                <div class="section-title">

                    <h1>Entre em contato</h1>

                    <p>
                        Preencha o formulário abaixo para
                        enviar uma mensagem.
                    </p>

                </div>


                <div class="form-container">

                    <form id="contact-form">

                       

                        <div class="form-group">

                            <label for="nome">
                                Nome *
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite seu nome"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                E-mail *
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Digite seu e-mail"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="telefone">
                                Telefone
                            </label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                            >

                        </div>


                        <div class="form-group">

                            <label for="assunto">
                                Assunto *
                            </label>

                            <textarea
                                id="assunto"
                                name="assunto"
                                placeholder="Digite sua mensagem"
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Enviar mensagem
                        </button>


                        <div
                            id="contact-message"
                            class="form-message"
                        ></div>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <footer>

        <div class="container">

            <p>
                ©
                <span class="current-year"></span>
                Meu Portfólio. Todos os direitos reservados.
            </p>

            <p>
                Desenvolvido por
                <a href="index.html">Giovana</a>.
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>

</body>

</html>
